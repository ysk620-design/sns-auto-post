name: review-test
on:
  push:
    branches: [claude/gemini-review]
    paths: ["review/build2.py", "review/target2.md", "review/rubric.md", "review/run.py", ".github/workflows/review-test.yml"]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts
          key: fonts-noto-cjk-jp-v1
      - run: bash scripts/setup_fonts.sh
      - run: |
          pip install -q -r requirements.txt
          if [ ! -x /usr/bin/google-chrome ]; then python -m playwright install --with-deps chromium; fi
      - uses: actions/cache@v4
        with:
          path: ~/.cache/voicevox
          key: voicevox-0.16.2-v1
      - run: bash scripts/setup_voicevox.sh
      - uses: actions/cache@v4
        with:
          path: ~/.cache/music
          key: music-${{ hashFiles('music/tracks.json') }}
          restore-keys: music-
      - run: python -m autopost.music download || true
      - name: 試作リール第2版を作る
        run: python review/build2.py
      - name: Geminiにレビューしてもらう
        run: python review/run.py review/v2 review/target2.md review/out2.md
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/v2 review/out2.md || true
          git commit -m "試作第2版とGeminiのレビュー" && git push || true
