name: review-test
on:
  push:
    branches: [claude/gemini-review]
    paths: ["review/target.md", "review/rubric.md", "review/run.py", "review/in/**"]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python review/run.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/out.md
          git commit -m "Geminiのレビュー結果" && git push || true
