name: スライド画像を作る

on:
  push:
    paths:
      - "queue/**/post.json"
      - "accounts/*.json"
      - "autopost/templates.py"
      - "autopost/style.css"
  workflow_dispatch:
    inputs:
      target:
        description: "queue＝キューの投稿 / examples＝見本を作り直す"
        type: choice
        options: [queue, examples]
        default: queue

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 日本語フォントを入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji

      - name: ライブラリを入れる
        run: |
          pip install -q -r requirements.txt
          if [ ! -x /usr/bin/google-chrome ]; then python -m playwright install --with-deps chromium; fi

      - name: 投稿データをチェック
        run: python -m autopost.validate

      - name: 画像を作る
        env:
          TARGET: ${{ inputs.target || 'queue' }}
        run: |
          if [ "$TARGET" = "examples" ]; then
            python -m autopost.render examples --all
          else
            python -m autopost.render queue
          fi

      - name: 画像を保存（コミット）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A queue examples
          if git diff --cached --quiet; then
            echo "変更はありません"
            exit 0
          fi
          git commit -m "スライド画像を作成"
          git push
