name: スライド画像を作る

on:
  push:
    paths:
      - "queue/**/post.json"
      - "accounts/*.json"
      - "autopost/templates.py"
      - "autopost/style.css"
  workflow_dispatch:
    inputs:
      target:
        description: "queue＝キューの投稿 / examples＝見本を作り直す / reel-test＝見本からリール動画を作って確認"
        type: choice
        options: [queue, examples, reel-test]
        default: queue

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts
          key: fonts-noto-cjk-jp-v1

      - name: 日本語フォントを用意
        run: bash scripts/setup_fonts.sh

      - name: ライブラリを入れる
        run: |
          pip install -q -r requirements.txt
          if [ ! -x /usr/bin/google-chrome ]; then python -m playwright install --with-deps chromium; fi

      - name: 投稿データをチェック
        run: python -m autopost.validate

      - name: 画像を作る
        env:
          TARGET: ${{ inputs.target || 'queue' }}
        run: |
          if [ "$TARGET" = "examples" ]; then
            python -m autopost.render examples --all
          elif [ "$TARGET" = "reel-test" ]; then
            mkdir -p out
            for d in examples/*/; do python -m autopost.reel "$d" "out/$(basename "$d").mp4"; done
          else
            python -m autopost.render queue
          fi

      - name: リール動画を保存（確認用）
        if: inputs.target == 'reel-test'
        uses: actions/upload-artifact@v4
        with:
          name: reels
          path: out/*.mp4
          retention-days: 3

      - name: 画像を保存（コミット）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A queue examples
          if git diff --cached --quiet; then
            echo "変更はありません"
            exit 0
          fi
          git commit -m "スライド画像を作成"
          git push
