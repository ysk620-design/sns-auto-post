name: 画像生成のテスト（一時的）

on:
  push:
    branches: [claude/imagegen-test]
    paths:
      - "autopost/imagegen.py"
      - ".github/workflows/imagegen-test.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 試しに絵を作る
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m autopost.imagegen --test imagegen_test2
      - name: できた絵をブランチに追加
        if: always()
        run: |
          if [ -d imagegen_test2 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add imagegen_test2
            git commit -m "画像生成のテスト結果" && git push || true
          fi
